services:
  postgres:
    image: postgres:16-alpine
    container_name: mobility-postgres
    environment:
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility_dev_password
      POSTGRES_DB: mobility_transactions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobility -d mobility_transactions"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
