services:
  tempo:
    image: grafana/tempo:2.8.2
    container_name: obs-tempo
    networks: [obs]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./infra/obs/tempo/config.yml:/etc/tempo/config.yml:ro
    expose:
      - "4317"
      - "3200"
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s
