############################################
# SERVICE
############################################
[SERVICE]
    Flush              1
    Daemon             Off
    Log_Level          info
    Parsers_File       parsers.conf
    HTTP_Server        On
    HTTP_Listen        0.0.0.0
    HTTP_Port          2020
    storage.type       memory
    
############################################
# INPUT — Docker Container Logs
############################################
[INPUT]
    Name                tail
    Tag                 container.*
    Path                /var/lib/docker/containers/*/*.log
    Parser              docker
    DB                  /fluent-bit/state/flb_container.db
    Mem_Buf_Limit       100MB
    Skip_Long_Lines     On
    Refresh_Interval    5
    Rotate_Wait         30
    storage.type        memory

############################################
# FILTER — Parse JSON log field (Pino)
############################################
[FILTER]
    Name                parser
    Match               container.*
    Key_Name            log
    Parser              json
    Reserve_Data        On
    Preserve_Key        Off

############################################
# FILTER — Add Static Labels
############################################
[FILTER]
    Name                modify
    Match               container.*
    Add                 service mobility-transactions
    Add                 env local

############################################
# FILTER — Normalize Level (optional)
############################################
[FILTER]
    Name                modify
    Match               container.*
    Rename              level log_level

############################################
# OUTPUT — Loki
############################################
[OUTPUT]
    Name                loki
    Match               container.*
    Host                loki
    Port                3100

    Labels              service=$service,env=$env,level=$log_level,container=$container_name

    Line_Format         json
    Auto_Kubernetes_Labels Off
    Retry_Limit         False
