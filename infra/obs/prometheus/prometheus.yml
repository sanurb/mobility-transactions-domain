global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "local"
    service: "mobility-transactions"

rule_files:
  - /etc/prometheus/rules/alert-rules.yml

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Infra self-scrape for dashboard
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

remote_write:
  - url: "http://mimir:9009/api/v1/push"
