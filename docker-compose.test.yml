# Optional: Use when you want persistent test database for debugging
# Run: docker compose -f docker-compose.test.yml up -d
# Then: DATABASE_URL=postgresql://test:test@localhost:5433/mobility_test pnpm test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: mobility-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: mobility_test
    ports:
      - "5433:5432" # Different port to avoid conflict
    tmpfs:
      - /var/lib/postgresql/data # In-memory for speed
